version: '3.8'

services:
  guia-desarrollo-guiado:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: guia-desarrollo-guiado-web
    ports:
      - '8148:80'
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://localhost/ || curl -fsS http://localhost/ || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
