<!DOCTYPE html>
<html lang="es-CO" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🚀 Guía Maestra: Desarrollo Guiado por IA (Gems ➔ Stitch ➔ AI Studio ➔ Supabase)</title>
  <meta name="description" content="Plataforma interactiva de formación en desarrollo guiado por IA: Gemini Gems, Google Stitch, Google AI Studio Apps y Backend Supabase con PostgreSQL & RLS." />
  
  <!-- Tipografía Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <!-- HEADER -->
  <header class="app-header">
    <div class="brand-container">
      <div class="brand-logo">💎</div>
      <div>
        <h1 class="brand-title">
          Guía de Desarrollo Guiado por IA
          <span class="brand-badge">Pipeline SDLC</span>
        </h1>
      </div>
    </div>

    <div class="header-actions">
      <div class="gamification-chip">
        <span id="user-level">🌱 Aprendiz SDLC</span>
        <span class="xp-badge" id="xp-count">0 XP</span>
      </div>

      <button class="btn-icon" onclick="window.App.toggleTheme()" title="Cambiar Tema (Claro/Oscuro)">🌓</button>
    </div>

    <!-- Barra de Progreso Superior -->
    <div class="progress-bar-container">
      <div class="progress-bar-fill" id="progress-fill"></div>
    </div>
  </header>

  <!-- LAYOUT PRINCIPAL -->
  <div class="app-layout">
    <!-- BARRA LATERAL (SIDEBAR) -->
    <aside class="sidebar">
      <div>
        <h3 class="sidebar-section-title">Módulos de Formación</h3>
        <ul class="nav-list" id="nav-modules-list"></ul>
      </div>

      <div style="margin-top: auto; padding-top: 1rem; border-top: 1px solid var(--border-color);">
        <div style="font-size: 0.8rem; color: var(--text-muted); line-height: 1.4;">
          <strong>Ecosistema Google & Supabase</strong><br />
          Gemini · Stitch · AI Studio · Supabase RLS
        </div>
      </div>
    </aside>

    <!-- ÁREA PRINCIPAL (MAIN) -->
    <main class="main-content" id="main-content">
      <!-- El contenido dinámico de cada módulo se inyecta desde app.js -->
    </main>
  </div>

  <!-- TOASTS CONTAINER -->
  <div class="toast-container" id="toast-container"></div>

  <!-- SCRIPTS -->
  <script src="js/modules-data.js"></script>
  <script src="js/generators.js"></script>
  <script src="js/quizzes.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
